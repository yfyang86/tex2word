name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Tests (pytest)
        run: uv run pytest -q

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build distributions
        run: uv build

      - name: Check package metadata
        run: |
          uvx twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  cjk-render:
    name: CJK render (LibreOffice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install LibreOffice + a CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-wqy-zenhei
          fc-cache -f

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (pdf extra for PDFium text extraction)
        run: uv sync --all-extras --dev

      - name: Render CJK .docx through LibreOffice and check the Chinese text
        run: uv run pytest tests/test_cjk_render.py tests/test_cjk_context.py -q -rs

  tikz-render:
    name: TikZ render (TeX engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install a TeX engine + TikZ/standalone
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended \
            texlive-pictures texlive-latex-extra
          pdflatex --version | head -1
          kpsewhich standalone.cls tikz.sty || true

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (pdf extra for PDFium rasterisation)
        run: uv sync --all-extras --dev

      - name: Compile a TikZ figure and check an image is embedded
        env:
          TEX2WORD_TIKZ_DEBUG: "1"
        run: uv run pytest tests/test_tikz_render.py -q -rs -s
